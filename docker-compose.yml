services:
  web:
    build:
      context: .
      dockerfile: src/ETicaret.Web/Dockerfile
    ports: ["8080:8080"]
    depends_on: [postgres, redis]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ETicaret;Username=ETicaret_user;Password=${DB_PASSWORD:-dev_password}

  api:
    build:
      context: .
      dockerfile: src/ETicaret.API/Dockerfile
    ports: ["5001:8080"]
    depends_on: [postgres, redis, rabbitmq]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ETicaret;Username=ETicaret_user;Password=${DB_PASSWORD:-dev_password}
      - Redis__ConnectionString=redis:6379
      - Jwt__Issuer=ETicaret.API
      - Jwt__Audience=ETicaret.Clients
      - Jwt__Key=${JWT_KEY:-SUPER_SECRET_MIN_32_CHARS_LONG_KEY}
      - Encryption__AesKey=${AES_KEY:-SUPER_SECRET_MIN_32_CHARS_LONG_KEY}
      - AdminSeed__Email=${ADMIN_EMAIL:-admin@eticaret.com}
      - AdminSeed__Password=${ADMIN_PASSWORD:-Admin123!}

  worker:
    build:
      context: .
      dockerfile: src/ETicaret.Worker/Dockerfile
    depends_on: [postgres, redis, rabbitmq, ollama]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ETicaret;Username=ETicaret_user;Password=${DB_PASSWORD:-dev_password}
      - Redis__ConnectionString=redis:6379

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes: 
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - uploads_data:/var/www/uploads
    depends_on: [web, api]

  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    environment:
      POSTGRES_DB: ETicaret
      POSTGRES_USER: ETicaret_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}

  elasticsearch:
    image: elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic_password_123}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    environment:
      - OLLAMA_KEEP_ALIVE=24h

volumes:
  pgdata:
  esdata:
  uploads_data:
  ollama_data:
